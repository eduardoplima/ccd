[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccd"
version = "0.1.0"
description = "Tooling for the Coordenadoria de Controle de Decisões (TCE/RN)"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pypdf",
    "pymssql",
    "SQLAlchemy",
    "python-dotenv",
    "docxtpl",
    "python-docx",
    "openpyxl",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
]
notebooks = [
    "langchain-openai",
    "langchain",
]

[tool.setuptools.packages.find]
include = ["ccd*"]

[tool.setuptools.package-data]
ccd = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "scripts/consultas",
    "scripts/json_antecedentes",
    # célula com sintaxe inválida (erro de parse não é suprimível por regra)
    "scripts/analise/preparacao_ontologia.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
ignore = ["E501"]  # line length handled by formatter, avoid noisy notebook-style strings

# LGPD: cliente de LLM só pode nascer em ccd/llm.py, que garante o destino
# (DeepSeek no Foundry do SERPRO). Qualquer outro arquivo que importe um cliente
# direto quebra o CI.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain_openai.ChatOpenAI".msg = "use ccd.llm.get_llm() — LLM só pela Azure do SERPRO (LGPD)"
"langchain_openai.AzureChatOpenAI".msg = "use ccd.llm.get_llm() — LLM só pela Azure do SERPRO (LGPD)"
"langchain_openai.OpenAIEmbeddings".msg = "embeddings fora do SERPRO são vedados (LGPD)"
"langchain_openai.AzureOpenAIEmbeddings".msg = "use ccd.llm — embeddings só pela Azure do SERPRO (LGPD)"
"openai.OpenAI".msg = "use ccd.llm.get_llm() — LLM só pela Azure do SERPRO (LGPD)"
"openai.AzureOpenAI".msg = "use ccd.llm.get_llm() — LLM só pela Azure do SERPRO (LGPD)"

[tool.ruff.lint.per-file-ignores]
# script em células de notebook (imports por seção, expressões de exibição)
"scripts/analise/planilha_nereu.py" = ["E402", "E702", "I001", "B018"]
# o factory é o único lugar autorizado a construir o cliente
"ccd/llm.py" = ["TID251"]
# notebooks entram no lint só pela regra de LLM (TID251): estilo de célula
# (imports por seção, expressões soltas) não é erro aqui.
"*.ipynb" = ["E", "F", "I", "UP", "B", "SIM"]
"scripts/erros/*" = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["ccd"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
