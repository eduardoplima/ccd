[project]
name = "ccd-web-workspace"
version = "0.1.0"
description = "Webapp Coordenadoria de Controle de Decisões (CCD) — backend FastAPI + frontend Next.js + libs de domínio (FRAP/CGAD). Módulos: CCD, CGAD, FRAP."
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["backend", "tools/frap", "tools/cgad"]

[tool.uv.sources]
tools = { workspace = true }
cgad = { workspace = true }
"ccd-web-backend" = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "TID"]

# LGPD: cliente de LLM só pode nascer em tools/frap/frap/llm.py, que garante o
# destino (DeepSeek no Foundry do SERPRO). Ver a regra irmã em ../pyproject.toml.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain_openai.ChatOpenAI".msg = "use frap.llm.get_llm_client() — LLM só pela Azure do SERPRO (LGPD)"
"langchain_openai.AzureChatOpenAI".msg = "use frap.llm.get_llm_client() — LLM só pela Azure do SERPRO (LGPD)"
"langchain_openai.OpenAIEmbeddings".msg = "embeddings fora do SERPRO são vedados (LGPD)"
"langchain_openai.AzureOpenAIEmbeddings".msg = "use frap.llm — embeddings só pela Azure do SERPRO (LGPD)"
"openai.OpenAI".msg = "use frap.llm.get_llm_client() — LLM só pela Azure do SERPRO (LGPD)"
"openai.AzureOpenAI".msg = "use frap.llm.get_llm_client() — LLM só pela Azure do SERPRO (LGPD)"

[tool.ruff.lint.per-file-ignores]
# o factory é o único lugar autorizado a construir o cliente
"tools/frap/frap/llm.py" = ["TID251"]
